<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Saying</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 45px;
      background: #6b1f2a;
      color: #eeeeee;
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
    }

    main {
      width: min(850px, 100%);
      min-height: calc(100vh - 90px);
      margin: 0 auto;
      padding: 45px;
      background: #555555;
      border-radius: 26px;
      box-shadow: 0 10px 35px #0007;
    }

    h1,
    h2,
    h3,
    h4 {
      color: #ffffff;
      line-height: 1.3;
    }

    h1 {
      font-size: 2.2rem;
    }

    h2 {
      font-size: 1.7rem;
    }

    a {
      color: #ffd0d0;
    }

    a:hover {
      color: #ffffff;
    }

    pre {
      overflow-x: auto;
      padding: 18px;
      background: #3d3d3d;
      border-radius: 12px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                   Consolas, monospace;
    }

    :not(pre) > code {
      padding: 2px 6px;
      background: #484848;
      border-radius: 6px;
    }

    blockquote {
      margin: 20px 0;
      padding: 8px 20px;
      border-left: 4px solid #999999;
      color: #dddddd;
      background: #4b4b4b;
      border-radius: 0 12px 12px 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #777777;
      margin: 30px 0;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #777777;
      text-align: left;
    }

    th {
      background: #484848;
    }

    #loading {
      text-align: center;
      color: #dddddd;
    }

    #error {
      color: #ffb0b0;
      text-align: center;
    }

    @media (max-width: 700px) {
      body {
        padding: 22px;
      }

      main {
        min-height: calc(100vh - 44px);
        padding: 28px;
        border-radius: 22px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <div id="loading">Loading…</div>

    <div id="content"></div>

    <div id="error"></div>
  </main>

  <script>
    const filePath = "saying.md";
    const refreshInterval = 2000;

    async function loadLatestMarkdown() {
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const error = document.getElementById("error");

      try {
        const uniqueTimestamp = Date.now();

        const response = await fetch(
          `${filePath}?t=${uniqueTimestamp}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdownText = await response.text();

        content.innerHTML = marked.parse(markdownText);

        loading.style.display = "none";
        error.textContent = "";

        document.title = "saying.md";

      } catch (err) {
        loading.style.display = "none";

        error.textContent =
          `Could not load saying.md: ${err.message}`;
      }
    }

    window.addEventListener(
      "DOMContentLoaded",
      loadLatestMarkdown
    );

    setInterval(
      loadLatestMarkdown,
      refreshInterval
    );
  </script>

</body>
</html>
