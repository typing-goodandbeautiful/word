<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background: white;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    /* Dark mode preference */
    @media (prefers-color-scheme: dark) {
      body {
        background: black;
      }
    }

    body.unlocked {
      background: #141413;
    }

    #pageContainer {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="pageContainer" frameborder="0"></iframe>

  <script>
    let pagesData = [];
    let codeMap = {};
    let isUnlocked = false;

    // Fetch pages.json on load
    window.addEventListener('DOMContentLoaded', () => {
      fetch('./pages.json')
        .then(response => response.json())
        .then(data => {
          pagesData = data;
          buildCodeMap();
          promptForCode();
        })
        .catch(error => {
          console.error('Error loading pages.json:', error);
          alert('Failed to load configuration');
        });
    });

    // Build code-to-page mapping
    function buildCodeMap() {
      codeMap = {};
      pagesData.forEach(page => {
        page.codes.forEach(code => {
          codeMap[code.toLowerCase()] = page.id;
        });
      });
    }

    // Prompt for code
    function promptForCode() {
      const code = window.prompt('Enter access code:');

      if (code === null) {
        // User clicked Cancel
        showBlankBackground();
        return;
      }

      const pageId = codeMap[code.toLowerCase()];

      if (pageId) {
        // Valid code
        isUnlocked = true;
        document.body.classList.add('unlocked');
        renderPage(pageId);
      } else {
        // Invalid code
        const retry = confirm('Invalid code. Try again?');
        if (retry) {
          promptForCode();
        } else {
          showBlankBackground();
        }
      }
    }

    // Show blank background (white or black depending on dark mode)
    function showBlankBackground() {
      isUnlocked = false;
      document.body.classList.remove('unlocked');
      document.getElementById('pageContainer').src = '';
    }

    // Render page based on ID
    function renderPage(pageId) {
      const page = pagesData.find(p => p.id === pageId);
      if (page) {
        const iframe = document.getElementById('pageContainer');
        iframe.src = page.htmlFile;
        
        // Wait for iframe to load, then get its background color
        iframe.onload = () => {
          try {
            const iframeBody = iframe.contentDocument.body;
            const bgColor = window.getComputedStyle(iframeBody).backgroundColor;
            document.body.style.backgroundColor = bgColor;
          } catch (error) {
            console.error('Could not access iframe background color:', error);
          }
        };
      } else {
        console.error('Page not found:', pageId);
      }
    }
  </script>
</body>
</html>
