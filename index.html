<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #pageContainer {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="pageContainer" frameborder="0"></iframe>

  <script>
    // Fetch config.json on load
    window.addEventListener('DOMContentLoaded', () => {
      fetch('./config.json')
        .then(response => response.json())
        .then(data => {
          loadPage(data.htmlFile);
        })
        .catch(error => {
          console.error('Error loading config.json:', error);
          alert('Failed to load configuration');
        });
    });

    // Load page into iframe
    function loadPage(htmlFile) {
      document.getElementById('pageContainer').src = htmlFile;
    }
  </script>
</body>
</html>
