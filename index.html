<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Saying</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Dark mode default */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: black;
            }
        }

        /* Light mode default */
        @media (prefers-color-scheme: light) {
            body {
                background-color: white;
            }
        }

        #pageContainer {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="pageContainer"></iframe>

    <script>
        async function loadPage() {
            try {
                const response = await fetch('config.json');
                const config = await response.json();
                const filePath = config.htmlFile;

                const iframe = document.getElementById('pageContainer');
                iframe.src = filePath;

                // Detect file type
                const fileExtension = filePath.split('.').pop().toLowerCase();
                const isHtml = ['html', 'htm'].includes(fileExtension);

                if (isHtml) {
                    // For HTML files, try to grab the background color
                    iframe.onload = function() {
                        try {
                            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                            const bgColor = window.getComputedStyle(iframeDoc.body).backgroundColor;
                            
                            // Determine fallback based on device dark mode preference
                            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                            const fallback = isDarkMode ? 'black' : 'white';
                            
                            document.body.style.backgroundColor = bgColor || fallback;
                        } catch (e) {
                            // CORS or other issues, use fallback based on device preference
                            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                            document.body.style.backgroundColor = isDarkMode ? 'black' : 'white';
                        }
                    };
                } else {
                    // For non-HTML files, use device default (already set by media query)
                    // No additional styling needed
                }
            } catch (error) {
                console.error('Error loading config or page:', error);
            }
        }

        loadPage();
    </script>
</body>
</html>
