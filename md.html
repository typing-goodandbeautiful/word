<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saying.md Viewer</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #30445c;
      color: #edf2f7;
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
    }

    main {
      max-width: 850px;
      margin: 50px auto;
      padding: 45px;
      background: #40566f;
      border-radius: 14px;
      box-shadow: 0 8px 30px #0006;
    }

    h1,
    h2,
    h3,
    h4 {
      color: #ffffff;
      line-height: 1.3;
    }

    h1 {
      font-size: 2.2rem;
    }

    h2 {
      font-size: 1.7rem;
    }

    a {
      color: #a9d4ff;
    }

    a:hover {
      color: #ffffff;
    }

    pre {
      overflow-x: auto;
      padding: 18px;
      background: #26384d;
      border-radius: 8px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco,
                   Consolas, monospace;
    }

    :not(pre) > code {
      padding: 2px 6px;
      background: #34495f;
      border-radius: 4px;
    }

    blockquote {
      margin: 20px 0;
      padding: 8px 20px;
      border-left: 4px solid #7891ad;
      color: #d3dde7;
      background: #394e66;
      border-radius: 0 6px 6px 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #617891;
      margin: 30px 0;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }

    th,
    td {
      padding: 10px 12px;
      border: 1px solid #617891;
      text-align: left;
    }

    th {
      background: #34495f;
    }

    #error {
      color: #ffb4b4;
      text-align: center;
    }

    #loading {
      text-align: center;
      color: #d3dde7;
    }

    @media (max-width: 700px) {
      main {
        margin: 20px;
        padding: 25px;
      }

      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <div id="loading">Loading…</div>
    <div id="content"></div>
    <div id="error"></div>
  </main>

  <script>
    async function loadMarkdown() {
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const error = document.getElementById("error");

      try {
        const response = await fetch("saying.md");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();

        content.innerHTML = marked.parse(markdown);

        loading.style.display = "none";
        document.title = "saying.md";
      } catch (err) {
        loading.style.display = "none";
        error.textContent =
          `Could not load saying.md: ${err.message}`;
      }
    }

    loadMarkdown();
  </script>

</body>
</html>
